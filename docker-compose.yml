services:

  web:
    build: .
    container_name: pesquisa_enps_web

    command: gunicorn enps.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120

    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    expose:
      - "8000"

    env_file:
      - .env

    depends_on:
      db_vector:
        condition: service_healthy
    restart: always

  # Rotinas periódicas: Kanban de período de experiência (move cards para "Vencendo", efetiva quem
  # terminou o período e dispara as notificações) e desligamentos agendados (inativa quem chegou
  # à data de demissão). Idempotentes: rodar de hora em hora é seguro.
  experiencia_job:
    build: .
    container_name: pesquisa_enps_experiencia_job
    command: sh -c "while true; do python manage.py atualizar_experiencia; python manage.py processar_desligamentos_agendados; sleep 3600; done"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      RUN_SETUP: "false"  # migrate/collectstatic ficam a cargo do serviço web
    depends_on:
      - web
    restart: always

    # Container exclusivo para a IA / pgvector
  db_vector:
    image: pgvector/pgvector:pg16 
    container_name: pesquisa_enps_db_vector
    volumes: 
      - postgres_vector_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${VECTOR_DB_USER}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD}
      POSTGRES_DB: ${VECTOR_DB_NAME}
    ports:
      - "5433:5432"  # Expõe na porta 5433 para não conflitar caso precise
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTOR_DB_USER} -d ${VECTOR_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  nginx:
    image: nginx:stable
    container_name: pesquisa_enps_nginx
    ports:
      - "5012:80"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always


volumes:
  postgres_vector_data:
  static_volume:
  media_volume: